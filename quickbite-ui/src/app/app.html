<header class="topbar">
  <a routerLink="/" class="brand">{{ title() }}</a>

  <nav class="nav-links">
    <a routerLink="/products" routerLinkActive="active">Products</a>
    @if (authService.isAdmin()) {
      <a routerLink="/products/manage" routerLinkActive="active">Manage Products</a>
      <a routerLink="/categories" routerLinkActive="active">Categories</a>
      <a routerLink="/brands" routerLinkActive="active">Brands</a>
    }
    @if (authService.isAuthenticated()) {
      <span class="user-pill">
        {{ authService.currentUser()?.name }} ({{ authService.userRole() }})
      </span>
      <button type="button" class="nav-btn" (click)="authService.logout()">Sign out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Sign in</a>
      <a routerLink="/register" routerLinkActive="active" class="nav-cta">Register</a>
    }
  </nav>
</header>

<main class="page-content">
  <router-outlet />
</main>

<div class="admin-shell">
  <aside class="admin-sidebar" aria-label="Admin navigation">
    <div class="sidebar-header">
      <span class="sidebar-title">QuickBite Admin</span>
      @if (authService.currentUser(); as user) {
        <span class="sidebar-user">{{ user.name }}</span>
      }
    </div>

    <nav class="sidebar-nav">
      <a
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Dashboard
      </a>
      <a routerLink="/admin/products" routerLinkActive="active">Products</a>
      <a routerLink="/admin/categories" routerLinkActive="active">Categories</a>
      <a routerLink="/admin/brands" routerLinkActive="active">Brands</a>
      <a routerLink="/admin/orders" routerLinkActive="active">Orders</a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </aside>

  <section class="admin-content">
    <router-outlet />
  </section>
</div>
